<!doctype html><html lang="hu"><head><meta charset="utf-8">
<!-- Forrás: src/app/opengraph-image.jpg — újragenerálás: npm run og -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,800&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#fbf7f2;color:#2e3033;font-family:Inter,sans-serif;position:relative;
 background-image:
  radial-gradient(55% 60% at 3% 105%, color-mix(in oklab,#2bb3c0 45%,transparent) 0%, transparent 70%),
  radial-gradient(45% 50% at 22% 100%, color-mix(in oklab,#7c8085 30%,transparent) 0%, transparent 70%),
  radial-gradient(40% 45% at 0% 75%, color-mix(in oklab,#1e7c85 35%,transparent) 0%, transparent 72%);}
.wrap{position:absolute;left:72px;top:64px;bottom:64px;width:820px;display:flex;flex-direction:column;justify-content:center}
.logo{position:absolute;top:0;left:0;width:64px;height:64px;border-radius:50%}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:30px;letter-spacing:-.01em}
.brand img{width:56px;height:56px;border-radius:50%}
.eyebrow{margin-top:64px;font-weight:500;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#1e7c85}
h1{white-space:nowrap;font-weight:800;font-size:76px;line-height:1.22;letter-spacing:-.035em}
em{font-family:"Instrument Serif",serif;font-weight:400;font-style:italic;letter-spacing:0;color:#1e7c85}
p{margin-top:26px;font-size:27px;line-height:1.35;font-weight:500;color:rgba(46,48,51,.78);max-width:600px}
.url{margin-top:auto;font-weight:500;font-size:22px;color:rgba(46,48,51,.7)}
.portrait{position:absolute;right:-10px;bottom:0;height:600px}
</style></head><body>
<div class="wrap">
 <img class="logo" src="../../public/brand/logo.webp" alt="">
 <h1>A neten legyél <em>TE</em> elöl<br>és ajánljon <em>TÉGED</em><br>az AI</h1>
</div>
<img class="portrait" src="../../src/assets/hero.webp" alt="">
</body></html>
